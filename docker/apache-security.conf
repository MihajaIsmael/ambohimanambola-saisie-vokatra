# Pas de listing de répertoires
<Directory /var/www/html>
    Options -Indexes
</Directory>

# Dossiers jamais servis
<DirectoryMatch "/\.git">
    Require all denied
</DirectoryMatch>
<DirectoryMatch "^/var/www/html/(init-db|vendor|docker)(/|$)">
    Require all denied
</DirectoryMatch>

# Fichiers sensibles : dotfiles, données, config, scripts
<FilesMatch "^(\..*|Dockerfile|.*\.(csv|sh|md|yml|yaml|json|lock|example))$">
    Require all denied
</FilesMatch>